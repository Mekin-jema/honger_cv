# Local development: live reload via mounted src, .env for config.
# Production: use the image from `docker build` (no compose).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-parser-api-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_DOCKER_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - ./src:/app/src:ro
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir src
  ollama:
    image: ollama/ollama:latest
    container_name: resume-parser-ollama-dev
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
